[project]
name = "dln-hausdorff-llc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vale", email = "valentinatrolese02@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "devinterp==1.3.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[project.scripts]
dln-hausdorff-llc = "dln_hausdorff_llc:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
markers = ["slow: the smoke run end to end, a few minutes on CPU"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
