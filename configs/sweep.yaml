arch: VGG4
epochs: 50
seeds: [0, 1, 2]
baseline:
  lr: 0.01
  batch_size: 128
  momentum: 0.0
  l2: 0.0
# One factor at a time around the baseline. Distinct configs share the baseline runs.
factors:
  lr: [0.001, 0.003, 0.01]
  batch_size: [32, 64, 128, 256]
  momentum: [0.0, 0.5, 0.9]
  l2: [0.0, 1.0e-4, 5.0e-4]
